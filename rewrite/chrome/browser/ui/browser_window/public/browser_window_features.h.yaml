blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Let BraveBrowserWindowFeatures use GetUserDataFactory().

      Brave's window features are created through the same factory as the
      Chromium ones, so tests can override them.
    add_friend:
      class_name: BrowserWindowFeatures
      friend_type: class BraveBrowserWindowFeatures
