substitutions:
  - description: |-
      Depend on //brave/browser/ui, which now owns the Brave
      RenderViewContextMenuMacCocoa/RenderViewContextMenuMacRemoteCocoa
      subclasses included by chrome_web_contents_view_delegate_views_mac.mm.
    regex:
      pattern: |-
        deps += [
              "//chrome/browser/renderer_host:delegate",
      replace: |-
        deps += [
              "//brave/browser/ui:ui",
              "//chrome/browser/renderer_host:delegate",
